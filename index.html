<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday My Love 💜</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Dancing+Script:wght@700&family=Nunito:wght@600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#b44dff;--soft:#f0dcff}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 110%,#7a1fc4 0,#1d0640 45%,#05000f 80%)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen[hidden]{display:none}

/* сердечки */
#hearts{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.heart{position:absolute;top:-40px;animation:fall linear forwards;filter:drop-shadow(0 0 4px rgba(180,77,255,.7))}
.heart svg{width:100%;height:100%;display:block}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--r));opacity:.3}}

/* 3D-коробка */
.scene{position:relative;width:260px;height:260px;perspective:900px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(rgba(180,77,255,.45),transparent 70%)}
.float{transform-style:preserve-3d;animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.gift{position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(-30deg);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotateX(-22deg) rotateY(330deg)}}
.cube{position:absolute;width:var(--s);height:var(--h);left:calc(var(--s)/-2);top:var(--y);transform-style:preserve-3d}
.cube i{position:absolute;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f{left:0;top:0;width:100%;height:100%;
  background:linear-gradient(90deg,transparent 41%,var(--soft) 41%,var(--soft) 59%,transparent 59%),linear-gradient(180deg,#b15cff,#6a1bb5)}
.f1{transform:translateZ(calc(var(--s)/2))}
.f2{transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.8)}
.f3{transform:rotateY(180deg) translateZ(calc(var(--s)/2));filter:brightness(.65)}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.8)}
.t{left:0;width:100%;height:var(--s);top:calc((var(--h) - var(--s))/2);transform:rotateX(90deg) translateZ(calc(var(--h)/2));
  background:linear-gradient(90deg,transparent 41%,var(--soft) 41%,var(--soft) 59%,transparent 59%),linear-gradient(0deg,transparent 41%,var(--soft) 41%,var(--soft) 59%,transparent 59%),#c58bff}
.open .body .t{background:radial-gradient(#e3c4ff,#b44dff 35%,#2a0060 80%)}
.lid{position:absolute;left:0;top:0;transform-style:preserve-3d}
.bt{left:0;width:100%;height:var(--s);top:calc((var(--h) - var(--s))/2);transform:rotateX(-90deg) translateZ(calc(var(--h)/2));background:#7a3bc0}
@keyframes lidOff{0%{transform:none}22%{transform:translateY(-34px) rotateZ(-5deg)}100%{transform:translate3d(150px,-300px,120px) rotateX(250deg) rotateY(200deg) rotateZ(50deg);visibility:hidden}}
.open .lid{animation:lidOff 1.5s cubic-bezier(.45,.05,.55,.95) forwards}
.bow{position:absolute;left:0;top:-52px;transform-style:preserve-3d}
.bow.w2{transform:rotateY(90deg)}
.bow b{position:absolute;width:38px;height:24px;top:-12px;border:6px solid var(--soft);border-radius:50%;box-shadow:0 0 8px rgba(255,255,255,.4)}
.bow .a{left:-36px;transform:rotate(-25deg)}
.bow .b{left:-2px;transform:rotate(25deg)}
.hrt{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translateY(40px) scale(0)}
.hl{position:absolute;left:-42px;top:-42px;width:84px;height:84px}
.hl svg{width:100%;height:100%;display:block}
.hw{position:absolute}
@keyframes heartUp{0%{transform:translateY(40px) scale(.05)}60%{transform:translateY(-100px) scale(1.15)}100%{transform:translateY(-85px) scale(1)}}
@keyframes bob{0%,100%{transform:translateY(-85px) scale(1)}50%{transform:translateY(-97px) scale(1.05)}}
.open .hrt{animation:heartUp 1.5s .7s both,bob 2.4s 2.2s ease-in-out infinite}
.q{position:absolute;top:-6px;font-size:42px;color:#ffe14d;text-shadow:0 0 16px #ffd000;animation:pulse 1.5s ease-in-out infinite;transition:opacity .4s}
.open .q{animation:none;opacity:0;visibility:hidden}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}

#snd{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:14px;z-index:120;width:44px;height:44px;border-radius:50%;border:0;color:#fff;font-size:20px;cursor:pointer;display:none;background:rgba(180,77,255,.35);box-shadow:0 0 14px rgba(180,77,255,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#snd.on{display:block}
.tap{position:absolute;bottom:12%;left:0;right:0;text-align:center;font-family:'Dancing Script',cursive;font-size:1.5rem;color:var(--soft);animation:pulse 2s ease-in-out infinite;transition:opacity .4s}
.scene.open~.tap{animation:none;opacity:0;visibility:hidden}
.title{font-family:'Dancing Script',cursive;font-size:2.6rem;text-align:center;margin-top:36px;padding:0 12px;
  text-shadow:0 0 6px #fff,0 0 14px var(--pink),0 0 30px var(--pink),0 0 50px var(--pink);
  opacity:0;transform:translateY(20px);transition:all 1s .5s}
.btn{margin-top:30px;padding:16px 44px;border:0;border-radius:30px;color:#fff;font:800 1.1rem 'Nunito',sans-serif;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),#7a1fc4);box-shadow:0 8px 25px rgba(180,77,255,.5);
  opacity:0;pointer-events:none;transition:opacity 1s 1.2s,transform .2s}
.btn:active{transform:scale(.95)}
.scene.open~.title{opacity:1;transform:none}
.scene.open~.btn{opacity:1;pointer-events:auto}

/* карусель */
#s2{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 50px)}
.top{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--soft);text-shadow:0 0 10px var(--pink)}
.carousel{position:relative;width:100%;height:min(400px,58vh);margin-top:24px;perspective:1000px}
.card{position:absolute;left:50%;top:50%;width:220px;height:310px;margin:-155px 0 0 -110px;cursor:pointer;
  transition:transform .6s,opacity .6s}
.ci{width:100%;height:100%;position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.2,.8,.3,1.2)}
.card.flipped .ci{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 12px 36px rgba(180,77,255,.35)}
.front{background:#fff;padding:10px;display:flex;flex-direction:column}
.img{flex:1;min-height:0;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#b44dff,#7a1fa2)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.hint{text-align:center;font-family:'Caveat',cursive;font-size:1.2rem;color:#7a1fc4;padding-top:6px}
.back{background:linear-gradient(135deg,#b44dff,#5b14a8);transform:rotateY(180deg);display:flex;align-items:center;
  justify-content:center;padding:26px;text-align:center;font-family:'Caveat',cursive;font-size:1.9rem;line-height:1.3;
  text-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav{display:flex;align-items:center;gap:26px;margin-top:26px}
.nb{width:52px;height:52px;border-radius:50%;border:0;color:#fff;font-size:28px;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),#7a1fc4);box-shadow:0 6px 20px rgba(180,77,255,.5)}
.nb:active{transform:scale(.9)}
#cnt{min-width:70px;text-align:center;font-weight:800;font-size:1.2rem;color:var(--soft)}
@media(max-width:480px){.title{font-size:2.2rem}}
</style>
</head>
<body>
<div id="hearts"></div>
<button id="snd" onclick="toggleMusic()" aria-label="музыка">🔊</button>

<!-- ЭКРАН 1: ПОДАРОК -->
<div class="screen" id="s1">
  <div class="scene" id="scene" onclick="openGift()">
    <div class="glow"></div>
    <div class="float"><div class="gift">
      <div class="cube body" style="--s:120px;--h:90px;--y:-10px"><i class="f f1"></i><i class="f f2"></i><i class="f f3"></i><i class="f f4"></i><i class="t"></i></div>
      <div class="lid">
        <div class="cube" style="--s:132px;--h:30px;--y:-40px"><i class="f f1"></i><i class="f f2"></i><i class="f f3"></i><i class="f f4"></i><i class="t"></i><i class="bt"></i></div>
        <div class="bow"><b class="a"></b><b class="b"></b></div>
        <div class="bow w2"><b class="a"></b><b class="b"></b></div>
      </div>
      <div class="hrt" id="hrt"></div>
    </div></div>
    <div class="q">?</div>
  </div>
  <div class="tap">Нажми на подарок 💜</div>
  <div class="title">Happy Birthday My Love</div>
  <button class="btn" onclick="showCarousel()">Дальше →</button>
</div>

<!-- ЭКРАН 2: КАРУСЕЛЬ -->
<div class="screen" id="s2" hidden>
  <div class="top">Для тебя, любимая 💜</div>
  <div class="carousel" id="car"></div>
  <div class="nav">
    <button class="nb" onclick="go(-1)">‹</button>
    <span id="cnt"></span>
    <button class="nb" onclick="go(1)">›</button>
  </div>
</div>

function hearts(k=40){

/* объёмное сердце-подушка: гладкие слои + спрятанная внутри сплошная «сердцевина», которая закрывает щели при взгляде сбоку */
(function(){const z0=19,N=24,box=document.getElementById('hrt');
for(let i=0;i<=N;i++){const z=-z0+i*(2*z0/N),k=Math.sqrt(Math.max(0,1-(z/z0)**2)),sc=.55+.45*k,l=Math.round(66-26*k);
const d=document.createElement('div');d.className='hl';d.style.transform=`translateZ(${z.toFixed(1)}px) scale(${sc.toFixed(3)})`;
d.innerHTML=HEART.replace('COLOR',`hsl(${Math.round(290-10*k)},85%,${l}%)`);box.appendChild(d)}
/* сердцевина: контур берём из того же сердечка */
const NS='http://www.w3.org/2000/svg',sv=document.createElementNS(NS,'svg'),pe=document.createElementNS(NS,'path');
pe.setAttribute('d','M12 21.5C5 16.5 2 12.8 2 9a5 5 0 0 1 10-1.6A5 5 0 0 1 22 9c0 3.8-3 7.5-10 12.5z');sv.appendChild(pe);box.appendChild(sv);
const len=pe.getTotalLength(),M=36,B=6,K=.97,P=[];
for(let i=0;i<M;i++){const q=pe.getPointAtLength(i/M*len);P.push([(q.x-12)*3.5,(q.y-12)*3.5])}
box.removeChild(sv);
let A=0;for(let i=0;i<M;i++){const a=P[i],b=P[(i+1)%M];A+=a[0]*b[1]-b[0]*a[1]}
const sg=A>0?1:-1,R=[];
for(let j=0;j<=B;j++){const a=-Math.PI/2+j*Math.PI/B;R.push([z0*Math.sin(a),.55+.45*Math.cos(a)])}
for(let i=0;i<M;i++){const a=P[i],b=P[(i+1)%M],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),th=Math.atan2(dy,dx),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,d=sg*(Math.sin(th)*mx-Math.cos(th)*my);
for(let j=0;j<B;j++){const z1=R[j][0],s1=R[j][1]*K,z2=R[j+1][0],s2=R[j+1][1]*K,sm=(s1+s2)/2,dz=z2-z1,dn=d*(s2-s1),H=Math.hypot(dz,dn)+1.2,W=L*sm+2,tau=Math.atan2(sg*dn,dz),zm=(z1+z2)/2,k=Math.sqrt(Math.max(0,1-(zm/z0)**2));
const w=document.createElement('div');w.className='hw';
w.style.cssText=`width:${W.toFixed(1)}px;height:${H.toFixed(1)}px;left:${(-W/2).toFixed(1)}px;top:${(-H/2).toFixed(1)}px;background:hsl(${Math.round(290-10*k)},85%,${Math.round(66-26*k)}%);transform:translate3d(${(mx*sm).toFixed(2)}px,${(my*sm).toFixed(2)}px,${zm.toFixed(2)}px) rotateZ(${th.toFixed(4)}rad) rotateX(${(Math.PI/2+tau).toFixed(4)}rad)`;box.appendChild(w)}}
})();

const FQ=n=>440*Math.pow(2,(n-69)/12);

const LC=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],LM=[[0,0,81,0,79,0,76,0],[0,0,79,0,76,0,74,0],[0,0,77,0,74,0,72,0],[0,0,76,0,0,0,72,0]];

function bell(n,t,d,v){
  [[1,1],[2,.25],[3.01,.08]].forEach(([m,a])=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=m===1?'triangle':'sine';o.frequency.value=FQ(n)*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d/m**.3);
    o.connect(g);g.connect(master);g.connect(wet);o.start(t);o.stop(t+d+.1);
  });
}
function pad(ns,t,d){
  ns.forEach(n=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=FQ(n>=50?n-12:n);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+.8);g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(g);g.connect(master);g.connect(wet);o.start(t);o.stop(t+d+.1)});
}
function key(n,t,d,v,ty){

  o.type=ty;o.frequency.value=FQ(n);f.type='lowpass';f.frequency.value=ty==='square'?3000:2000;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(f);f.connect(g);g.connect(master);g.connect(wet);o.start(t);o.stop(t+d+.05);
}
const play=(tr,n,t,d,v)=>tr.inst==='key'?key(n,t,d,v,tr.ty):bell(n,t,d,v);

function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);

    const tr=TR[mtr],dt=60/tr.bpm/(tr.div||2),bar=tr.bars[Math.floor(stp/tr.len)%tr.bars.length],i=stp%tr.len;
    if(i===0)pad(bar.c,nextT,dt*tr.len+.4);
    if(tr.pat)play(tr,bar.c[tr.pat[i]]+tr.ao,nextT,1.5,.07);
    if(tr.comp&&tr.comp.includes(i))bar.c.forEach(n=>play(tr,n,nextT,tr.cd,.035));
    const dr=tr.dr;
    if(dr){if(dr.k.includes(i))kick(nextT);if(dr.s.includes(i))hit(nextT,1800,.14,.2,'bandpass');if(dr.h.includes(i))hit(nextT,7000,.05,.06,'highpass')}
    if(bar.m[i])play(tr,bar.m[i],nextT,tr.md||2.4,bar.m[i]<55?.07:.12);
    nextT+=dt;stp++;
  }
}
function startMusic(){
  if(started)return;started=true;
  document.getElementById('snd').classList.add('on');
  if(MUSIC_FILE){song=new Audio(MUSIC_FILE);song.loop=true;song.volume=.7;song.play().catch(()=>{});musicOn=true;return}
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=.55;master.connect(ac.destination);
    const conv=ac.createConvolver(),len=ac.sampleRate*2.4,buf=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
    conv.buffer=buf;wet=ac.createGain();wet.gain.value=.4;wet.connect(conv);conv.connect(master);
    ac.resume();nextT=ac.currentTime+.1;timer=setInterval(sched,120);musicOn=true;
  }catch(e){console.warn('audio',e)}
}
function toggleMusic(){
  musicOn=!musicOn;
  document.getElementById('snd').textContent=musicOn?'🔊':'🔇';
  if(song){musicOn?song.play():song.pause();return}
  if(ac){musicOn?ac.resume():ac.suspend()}
}
document.addEventListener('visibilitychange',()=>{
  if(!musicOn)return;
  if(document.hidden){song?song.pause():ac&&ac.suspend()}else{song?song.play():ac&&ac.resume()}
});

function openGift(){
  startMusic();
  const s=document.getElementById('scene');
  if(s.classList.contains('open'))return;
  s.classList.add('open');hearts(70);
}
function showCarousel(){
  document.getElementById('s1').hidden=true;
  document.getElementById('s2').hidden=false;
  render();hearts(40);
}

/* карусель: карточки создаются один раз, меняются только позиции */
const car=document.getElementById('car');
const els=cards.map((c,i)=>{
  const d=document.createElement('div');
  d.className='card';
  d.innerHTML=`<div class="ci"><div class="face front"><div class="img">${art(i)}</div><div class="hint">Нажми, чтобы перевернуть</div></div><div class="face back">${c.msg}</div></div>`;
  d.onclick=()=>{
    if(swiped){swiped=false;return}
    if(i===cur){d.classList.toggle('flipped');if(d.classList.contains('flipped'))hearts(18)}
    else go(off(i));
  };
  car.appendChild(d);return d;
});
function off(i){const o=((i-cur)%n+n)%n;return o>n/2?o-n:o}
function render(){
  els.forEach((d,i)=>{
    const o=off(i),a=Math.abs(o);
    d.style.transform=`translateX(${o*95}px) translateZ(${-a*90}px) rotateY(${o*32}deg)`;
    d.style.opacity=a>2?0:1-a*.3;
    d.style.zIndex=10-a;
    d.style.pointerEvents=a>2?'none':'auto';
  });
  document.getElementById('cnt').textContent=`${cur+1} / ${n}`;
}
function go(d){
  els.forEach(e=>e.classList.remove('flipped'));
  cur=(cur+d+n)%n;render();
}
let sx=0;
car.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
car.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>45){swiped=true;go(dx<0?1:-1);setTimeout(()=>{swiped=false},300)}
},{passive:true});
</script>
